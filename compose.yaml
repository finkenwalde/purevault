name: purevault
services:
  web:
    build: .
    image: purevault:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    # Uncomment the environment block and the settings you want to change.
    # environment:
    #   PUREVAULT_ALLOWED_HOSTS: "localhost,127.0.0.1,vault.example.com" #optional
    #   PUREVAULT_DISPLAY_TIMEZONE: "Etc/UTC" #optional
    volumes:
      - purevault_data:/data
      - purevault_keys:/keys
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  purevault_data:
  purevault_keys:

