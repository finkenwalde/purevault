name: purevault
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: purevault:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - purevault_data:/data
      - purevault_keys:/keys
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  purevault_data:
  purevault_keys:

