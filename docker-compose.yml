services:
  purevault:
    build: .
    container_name: purevault
    restart: unless-stopped
    ports:
      - "${PUREVAULT_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECURE_COOKIES: ${DJANGO_SECURE_COOKIES:-0}
      TZ: ${TZ:-UTC}
      DATA_DIR: /data
    volumes:
      - lockbox_data:/data

volumes:
  lockbox_data:
